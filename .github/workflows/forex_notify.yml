name: Forex Live News Alerts

on:
  schedule:
    # Malaysia weekdays: Sunday 16:00 UTC through Friday 15:59 UTC.
    - cron: "*/5 16-23 * * 0-4"
    - cron: "*/5 0-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-live-alerts
  cancel-in-progress: false

jobs:
  send-forex-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Forex notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'scheduled' }}
          CURRENCIES: USD
          IMPACT_LEVELS: high,medium
        run: python forex_notify.py

      - name: Persist notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bot_state.json
          if git diff --cached --quiet; then
            echo "Notification state is unchanged."
          else
            git commit -m "Update Forex notification state [skip ci]"
            git push
          fi
